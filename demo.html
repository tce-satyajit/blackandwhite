<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulations</title>
    <style>
        /* E-ink treatment: no colour anywhere, no glow. E-paper cannot emit light, so
           there are no soft shadows or gradients - only paper, ink, hairlines, and
           hard inversion for emphasis. Self-contained: no external fonts or assets. */
        * { box-sizing: border-box; }

        :root {
            /* Sampled from E Ink Carta: the panel never reaches pure white, and its
               black is a dark warm grey rather than #000. Both carry a faint warm cast
               from the microcapsule layer, which is what stops it looking like an LCD. */
            --paper:   #e9e6df;   /* the sheet at rest */
            --panel:   #f4f2ec;   /* a freshly cleared area, still off-white */
            --ink:     #171613;   /* fully developed black particles */
            --ink-mid: #55534c;
            --ink-low: #86847c;
            --hair:    #cbc7be;   /* the faintest rule the display can hold */
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Faint paper grain, so the sheet is not a flat digital white */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: .05;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
        }
        header, main, .modal { position: relative; z-index: 1; }

        /* Labels and controls take a plain face, the way e-reader chrome does */
        .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        /* Sticky rather than fixed: sticky stays in the flow, so the band
           holds its own height at the top of the page and nothing has to
           be padded down by hand to sit clear of it.
           The z-index is not optional. The rule above puts header and main
           both on z-index 1, and where two stacking contexts tie, the one
           later in the document wins - so the cards would scroll over the
           band rather than under it. 10 clears main and still passes
           beneath the modal at 50. */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #242424;
            padding: 5px;
            color: gray;
        }
        header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
        header p { margin: 4px 0 0; font-size: 13px; color: var(--ink-mid); font-style: italic; }

        /* At a 272px track, 1560px of page fits five columns (5x272 + 4x18
           = 1432). auto-fit still drops to four, three, two or one as the
           window narrows, so nothing has to be said about breakpoints. */
        main { max-width: 1560px; margin: 0 auto; padding: 22px 20px 34px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(272px, 1fr));
            gap: 18px;
        }
        
        .card {
            background: var(--panel);
            
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: none;
            transition: box-shadow .12s steps(2, end);
        }
        /* A hard offset block, not a blur: e-ink has no soft falloff */
        .card:hover { box-shadow: 5px 5px 0 var(--ink); }
        .cardNumber{
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    /* position: relative; */
    /* float: right; */
    /* right: -50px; */
    /* background: #c8c8c8; */
    padding-left: 7px;
    padding-top: 7px;
    color: black;
    /* width: 40px; */
    text-align: center;
    /* border-radius: 7px; */
    display: flex;
    align-content: flex-start;
    align-items: center;
        }
        .cardNumberText{
            background: #dadada;
    width: 30px;
    height: 30px;
    line-height: 30px;
    border-radius: 4px;
    align-items: center;
    color: white;
    text-align: center;
    font-size: 16px;
        }
        .shot {
            display: block;
            width: 100%;
            border: 0;
             /* border-bottom: 1px solid var(--ink-low);  */
            padding: 8px;
            background: var(--panel);
            cursor: pointer;
            position: relative;
            line-height: 0;
            
        }
        /* Thumbnails: grey, contrast-boosted, warmed, then dimmed so their whites
           land on paper level rather than #fff, which e-ink can never display. */
        .shot img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(1) contrast(1.12) sepia(.18) brightness(.94);
            border-radius: 12px;
        }
        .shot::after {
            content: "Open simulation";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--paper);
            background: rgba(23, 22, 19, .74);
            opacity: 0;
            transition: opacity .12s steps(2, end);
        }
        .shot:hover::after, .shot:focus-visible::after { opacity: 1; }

        .body { padding: 9px; display: flex; flex-direction: column; gap: 8px; flex: 1; }

        .tag {
            align-self: flex-start;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 9px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #7b7a77;
    background: transparent;
    border: 1px solid #b4b4b4;
    border-radius: 5px;
    padding: 2px 7px;
        }
        .card h2 { margin: 0; padding: 10px 9px 8px; font-size: 15px;
                   font-weight: 700; letter-spacing: -.01em; }
        .body p { margin: 0; font-size: 12px; line-height: 1.55; color: var(--ink-mid); flex: 1; }

        /* Rule between the copy and the controls, like a printed divider */
        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            padding-top: 10px;
            border-top: 1px solid var(--hair);
        }

        button.act {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--ink);
            background: transparent;
            color: var(--ink);
            transition: none;      /* e-ink snaps between states, it does not fade */
        }
        button.act:hover  { background: var(--ink); color: var(--paper); }
        button.act.primary { background: var(--ink); color: var(--paper); }
        button.act.primary:hover { background: transparent; color: var(--ink); }
        button.act:active { transform: translate(1px, 1px); }

        button.act:focus-visible, .shot:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px;
        }

        /* ---- While demo.json is on its way ----
           Four cells filling one at a time. E-paper cannot fade, so nothing
           here does either: the keyframes step between full ink and none,
           the way a real panel repaints a region. */
        .loading {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 90px 0 110px;
        }
        .loading .cells { display: flex; gap: 7px; }
        .loading .cells i {
            width: 13px;
            height: 13px;
            border: 1px solid var(--ink);
            border-radius: 2px;
            background: transparent;
            animation: ink 1.2s linear infinite;
        }
        .loading .cells i:nth-child(2) { animation-delay: .3s; }
        .loading .cells i:nth-child(3) { animation-delay: .6s; }
        .loading .cells i:nth-child(4) { animation-delay: .9s; }
        @keyframes ink {
            0%, 25%      { background: var(--ink); }
            25.01%, 100% { background: transparent; }
        }
        .loading p {
            margin: 0;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--ink-low);
        }
        @media (prefers-reduced-motion: reduce) {
            .loading .cells i { animation-duration: 3.6s; }
        }

        /* ---- Modal ---- */
        .modal { position: fixed; inset: 0; z-index: 50; display: none; }
        .modal.open { display: block; }
        .backdrop { position: absolute; inset: 0; background: rgba(23, 22, 19, .82); }
        .frame-wrap {
            position: absolute;
            inset: 2vh 2vw;
            background: var(--panel);
            border: 2px solid var(--ink);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: none;
        }
        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 5px;
            
            background: var(--panel);
            flex: none;
        }
        .bar h3 { margin: 0; font-size: 14px; font-weight: 700; }
        .bar .right { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1;
            width: 90px;
            height: 30px;
            border-radius: 12px;
            border: 1.5px solid var(--ink);
            background: transparent;
            color: var(--ink);
            cursor: pointer;
        }
        .icon-btn:hover { background: var(--ink); color: var(--paper); }
        iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--panel); }

        @media (max-width: 640px) {
            .frame-wrap { inset: 0; border: 0; border-radius: 0; }
        }
    </style>
</head>
<body>

    <header>
        <h1>BLACK & WHITE</h1>
        <p>Interactive Simulations</p>
    </header>

    <main>
        <div class="grid">

            <!-- Cards are written in by the script below, from demo.json.
                 Until they arrive, this stands in their place. -->
            <div class="loading ui" role="status" aria-live="polite">
                <div class="cells"><i></i><i></i><i></i><i></i></div>
                <p>Loading simulations</p>
            </div>

        </div>
    </main>

    <!-- Simulation viewer -->
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="backdrop" data-close></div>
        <div class="frame-wrap">
            <iframe id="frame" title="Simulation" allow="autoplay; fullscreen"></iframe>
            <div class="bar">
                <h3 id="modal-title"></h3>
                <div class="right">
                    <!-- <button class="act" id="pop-out">New Window</button> -->
                    <!-- <button class="icon-btn" id="modal-close" aria-label="Close" title="Close">&times;</button> -->
                     <button class="icon-btn" id="modal-close" aria-label="Close" title="Close">Close</button>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const frame = document.getElementById('frame');
        const modalTitle = document.getElementById('modal-title');
        let currentSrc = '';

        function openModal(src, title) {
            currentSrc = src;
            //modalTitle.textContent = title;
            frame.src = src;
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
            document.getElementById('modal-close').focus();
        }

        function closeModal() {
            modal.classList.remove('open');
            // Drop the src so the simulation stops animating and any audio stops with it,
            // rather than running unseen behind the page.
            frame.removeAttribute('src');
            document.body.style.overflow = '';
        }

        function openWindow(src) {
            window.open(src, '_blank', 'noopener');
        }

        // ---- The gallery, written out from demo.json ------------------
        // Every card on this page is one entry in that file. Adding a
        // simulation means adding an object to it, and nothing else.
        const grid = document.querySelector('.grid');
        const attr = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;');

        function cardHTML(c) {
            const src = attr(c.src), ttl = attr(c.modalTitle || c.title);
            return '<article class="card">' +
                    
                    '<div class="cardNumber">'+'<div class="cardNumberText">'+c.cardNumer+ '</div>' + '<h2>' + c.title + '</h2>'+'</div>' +
                    //  '<h2>' + c.title + '</h2>' +
                     '<button class="shot" data-src="' + src + '" data-title="' + ttl + '"' +
                             ' aria-label="Open ' + attr(c.title) + ' simulation">' +
                       '<img src="' + attr(c.thumb) + '" alt="' + attr(c.alt) + '">' +
                     '</button>' +
                     '<div class="body">' +
                       '<p>' + c.body + '</p>' +
                       '<span class="tag">' + c.tag + '</span>' +
                       '<div class="actions">' +
                         '<button class="act primary" data-open="modal" data-src="' + src +
                                 '" data-title="' + ttl + '">Open in Modal</button>' +
                         '<button class="act" data-open="window" data-src="' + src + '">New Window</button>' +
                         
                       '</div>' +
                     '</div>' +
                   '</article>';
        }

        function render(data) {
            for(var i = 0; i < data.cards.length; i++) {
                data.cards[i].cardNumer = i + 1;
            }
            console.log('demo.json', data);
            if (data.title) document.querySelector('header h1').textContent = data.title;
            if (data.subtitle) document.querySelector('header p').textContent = data.subtitle;
            grid.innerHTML = (data.cards || []).map(cardHTML).join('');

            // Thumbnails and the per-card buttons all carry their target on
            // data attributes, so one pass over the grid wires the lot.
            grid.querySelectorAll('.shot').forEach(el => {
                el.addEventListener('click', () => openModal(el.dataset.src, el.dataset.title));
            });
            grid.querySelectorAll('[data-open]').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.dataset.open === 'window') openWindow(btn.dataset.src);
                    else openModal(btn.dataset.src, btn.dataset.title);
                });
            });
        }

        // demo.json is read live, so editing it is the whole of adding or
        // reordering a simulation. It has to be fetched over http: a browser
        // treats every file:// page as its own origin and will not let one
        // read a file sitting beside it, so opening this page off the disk
        // gets the note below rather than a silently empty gallery.
        fetch('demo.json')
            .then(r => r.ok ? r.json() : Promise.reject(r.status))
            .then(render)
            .catch(() => {
                grid.innerHTML = '<p class="ui" style="color:var(--ink-mid);line-height:1.7">' +
                    '<b>demo.json could not be read.</b><br>' +
                    'This page has to be served rather than opened from the disk. From this ' +
                    'folder run <code>python3 -m http.server</code> and open ' +
                    '<code>http://localhost:8000/demo.html</code>.</p>';
            });

        // document.getElementById('pop-out').addEventListener('click', () => {
        //     const src = currentSrc;
        //     closeModal();
        //     openWindow(src);
        // });

        document.getElementById('modal-close').addEventListener('click', closeModal);
        modal.querySelector('[data-close]').addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
        });
    </script>
</body>
</html>
